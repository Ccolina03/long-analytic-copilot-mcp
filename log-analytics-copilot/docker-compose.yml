services:
  kafka:
    image: bitnamilegacy/kafka:3.7
    container_name: lac-kafka
    ports:
      - "9092:9092"
    environment:
      # KRaft mode: this single node is both broker and controller.
      - KAFKA_CFG_NODE_ID=0
      - KAFKA_CFG_PROCESS_ROLES=broker,controller
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=0@kafka:9093

      # Three listeners:
      #   EXTERNAL  -> reached from the host (localhost:9092)
      #   INTERNAL  -> reached from other containers (kafka:29092)
      #   CONTROLLER-> KRaft quorum traffic
      - KAFKA_CFG_LISTENERS=EXTERNAL://:9092,INTERNAL://:29092,CONTROLLER://:9093
      - KAFKA_CFG_ADVERTISED_LISTENERS=EXTERNAL://localhost:9092,INTERNAL://kafka:29092
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=EXTERNAL:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      - KAFKA_CFG_INTER_BROKER_LISTENER_NAME=INTERNAL
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER

      - KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE=true
      - ALLOW_PLAINTEXT_LISTENER=yes
    healthcheck:
      test: ["CMD", "bash", "-lc", "/opt/bitnami/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  spark-master:
    image: bitnamilegacy/spark:3.5
    container_name: lac-spark-master
    environment:
      - SPARK_MODE=master
    ports:
      - "8080:8080"
      - "7077:7077"
    volumes:
      - .:/workspace

  spark-worker:
    image: bitnamilegacy/spark:3.5
    container_name: lac-spark-worker
    depends_on:
      - spark-master
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
    ports:
      - "8081:8081"
    volumes:
      - .:/workspace

  mcp-server:
    image: python:3.12-slim
    container_name: lac-mcp-server
    working_dir: /app
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./mcp-server:/app
    command: >
      sh -c "pip install --no-cache-dir -r requirements.txt && uvicorn main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
