syntax = "proto3";

package logs.v1;

option go_package = "github.com/example/log-analytics-copilot/proto/logsv1;logsv1";

message LogEvent {
  // ISO-8601 timestamp in UTC (example: 2026-04-30T15:47:00Z)
  string timestamp = 1;
  string service = 2;
  string level = 3;
  string message = 4;
  string trace_id = 5;
  string event_id = 6;
  string host = 7;
}

message Ack {
  bool ok = 1;
  uint64 accepted = 2;
  string message = 3;
}

service LogIngestionService {
  // Streaming ingestion endpoint used by clients/load generators.
  rpc PushLogs(stream LogEvent) returns (Ack);
}
